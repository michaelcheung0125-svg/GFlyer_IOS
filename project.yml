name: GFlyerIOS
options:
  bundleIdPrefix: com.geopilot
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GFlyerIOS:
    type: application
    platform: iOS
    sources:
      - path: GFlyerIOS
        excludes:
          - Vendor
          - Resources
    resources:
      - path: GFlyerIOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geopilot.gflyer.ios
        PRODUCT_NAME: GFlyer
        PRODUCT_MODULE_NAME: GFlyerIOS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GFlyerIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: GFlyerIOS/GFlyerIOS.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited)"
      configs:
        Idevice:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GFLYER_IDEVICE"
          HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/include"
          LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/lib"
          OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
  GFlyerIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GFlyerIOSTests
    dependencies:
      - target: GFlyerIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geopilot.gflyer.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GFlyer.app/GFlyer"
        BUNDLE_LOADER: "$(TEST_HOST)"
configs:
  Debug: debug
  Release: release
  Idevice: debug
schemes:
  GFlyerIOS:
    build:
      targets:
        GFlyerIOS: all
        GFlyerIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GFlyerIOSTests
    archive:
      config: Release
  GFlyerIOS-Idevice:
    build:
      targets:
        GFlyerIOS: all
    run:
      config: Idevice
    archive:
      config: Idevice
