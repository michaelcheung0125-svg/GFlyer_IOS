name: GFlyerIOS
options:
  bundleIdPrefix: com.geopilot
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 兩個版本用同一個版本號（和 Android 相同）。兩個版本的 Info.plist 都寫
    # $(MARKETING_VERSION) 和 $(CURRENT_PROJECT_VERSION)，發佈時只改這裏
    # （docs/RELEASE_PROCESS.md 第 1 步）。
    MARKETING_VERSION: "0.6.17"
    CURRENT_PROJECT_VERSION: "30"
# 兩個 App target（docs/APP_STORE_PLAN.md 第 8 項）：GFlyerIOS 是親友版，經 SideStore
# 安裝；GFlyerPublic 是要上 App Store 的公開版。GFlyerIOS/ 兩個版本共用，
# GFlyerIOS/Family/ 只給親友版，GFlyerIOS/Public/ 只給公開版；每個版本的 Info.plist 和
# entitlements 在自己的資料夾。App 圖示和飛豬圖兩個版本相同，在共用的
# GFlyerIOS/Resources/Assets.xcassets，由 scripts/make_brand_art.py 從品牌中心的正本轉出。
# 共用的程式只經 Edition 碰版本專屬的東西（GFlyerIOS/Edition/EditionFeatures.swift）。
#
# 兩個 target 的 PRODUCT_MODULE_NAME 都是 GFlyerIOS，共用測試的 @testable import
# GFlyerIOS 兩邊都能用。所以兩個 App 不可以在同一次建置裏一起編：scheme 各自只建一個。
targets:
  GFlyerIOS:
    type: application
    platform: iOS
    # Resources 必須留在 sources 裡：XcodeGen 沒有 target 層級的 `resources`
    # 欄位，寫了會被忽略。之前把 Resources 排除又只寫在被忽略的 `resources`
    # 下，結果 Assets.xcassets 從未加入 target，打包出來的 App 沒有任何圖片。
    # XcodeGen 會自動把 .xcassets 放進 Resources build phase 交給 actool 編譯。
    sources:
      - path: GFlyerIOS
        excludes:
          - Vendor
          - Family
          - Public
      - path: GFlyerIOS/Family
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geopilot.gflyer.ios
        PRODUCT_NAME: GFlyer
        PRODUCT_MODULE_NAME: GFlyerIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GFlyerIOS/Family/Info.plist
        CODE_SIGN_ENTITLEMENTS: GFlyerIOS/Family/GFlyerIOS.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited)"
      configs:
        Idevice:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GFLYER_IDEVICE"
          HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/include"
          LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/lib"
          OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
  # 公開版。除了 bundle id、名稱和版本資料夾，設定和親友版相同；改其中一個時兩個一起改。
  GFlyerPublic:
    type: application
    platform: iOS
    sources:
      - path: GFlyerIOS
        excludes:
          - Vendor
          - Family
          - Public
      - path: GFlyerIOS/Public
    # App 內建的本機通道（docs/APP_STORE_PLAN.md 第 12 項），放進 App 的 PlugIns/
    dependencies:
      - target: GFlyerPublicTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetpiggy.gflyer
        PRODUCT_NAME: GFlyerPublic
        PRODUCT_MODULE_NAME: GFlyerIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GFlyerIOS/Public/Info.plist
        CODE_SIGN_ENTITLEMENTS: GFlyerIOS/Public/GFlyerPublic.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited)"
      configs:
        Idevice:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GFLYER_IDEVICE"
          HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/include"
          LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/lib"
          OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
        # 和 Idevice 相同，改其中一個時兩個一起改
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GFLYER_IDEVICE"
          HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/include"
          LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GFlyerIOS/Vendor/idevice/lib"
          OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
  # 公開版的本機通道：Packet Tunnel extension，只把目標 IP 的封包對調位址後送回 iPhone 自己。
  # 免費 Apple ID 簽不了 Network Extension，所以只有公開版有；親友版照舊用 LocalDevVPN。
  # PacketReflector.swift 同時編進公開版的 App，App 和測試都用得到它。
  GFlyerPublicTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: GFlyerPublicTunnel
      - path: GFlyerIOS/Public/Tunnel/PacketReflector.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetpiggy.gflyer.tunnel
        PRODUCT_NAME: GFlyerPublicTunnel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GFlyerPublicTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: GFlyerPublicTunnel/GFlyerPublicTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # GFlyerIOSTests/Public/ 測的是公開版才有的功能，只在公開版跑。
  GFlyerIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GFlyerIOSTests
        excludes:
          - Public
    dependencies:
      - target: GFlyerIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geopilot.gflyer.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GFlyer.app/GFlyer"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # 同一份共用測試，在公開版的 App 裏跑。GFlyerIOSTests/Family/ 測的是親友版才有的功能，只在親友版跑。
  GFlyerPublicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GFlyerIOSTests
        excludes:
          - Family
    dependencies:
      - target: GFlyerPublic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetpiggy.gflyer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GFlyerPublic.app/GFlyerPublic"
        BUNDLE_LOADER: "$(TEST_HOST)"
# Idevice 連結 libidevice_ffi.a、可以控制 iPhone，是 debug 類：親友版經 SideStore 發佈的就是它。
# AppStore 是公開版上傳 App Store Connect 用的，和 Idevice 一樣連結 libidevice_ffi.a，但是 release 類：
# 有最佳化和 dSYM，執行檔經過 strip，不帶 debug map 裏建置機器上的路徑（docs/APP_STORE_PLAN.md 第 23 項）。
configs:
  Debug: debug
  Release: release
  Idevice: debug
  AppStore: release
schemes:
  GFlyerIOS:
    build:
      targets:
        GFlyerIOS: all
        GFlyerIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GFlyerIOSTests
    archive:
      config: Release
  GFlyerIOS-Idevice:
    build:
      targets:
        GFlyerIOS: all
    run:
      config: Idevice
    archive:
      config: Idevice
  GFlyerPublic:
    build:
      targets:
        GFlyerPublic: all
        GFlyerPublicTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GFlyerPublicTests
    archive:
      config: Release
  GFlyerPublic-Idevice:
    build:
      targets:
        GFlyerPublic: all
    run:
      config: Idevice
    archive:
      config: AppStore
