name: macOS Xcode validation

# 這個 workflow 跑在 macos-26 上。本 repo 是公開的，標準 runner 不計費；repo 還是
# 私有時 macOS runner 以 10 倍計費，每次 push 大約吃掉 60-80 分鐘的 included 額度，
# 下面的取捨是那時做的，現在省的是等結果的時間。改成私有之前先讀
# docs/RELEASE_PROCESS.md 的 CI 段落。
on:
  push:
    # 純文件改動不需要編譯。commit 訊息的 [skip ci] 仍然有效，這裡是自動化
    # 的第二道防線，免得忘記加。只要 commit 有動到任何一個非文件檔案，
    # paths-ignore 就不會生效，CI 照跑。
    #
    # 這些樣式要用 '**/' 開頭，不要寫成 'LICENSE' 這種只匹配 repo 根目錄的
    # 形式：新增 .claude/skills/write-swift/LICENSE 時就是這樣漏掉，整輪 CI
    # 白跑了一次。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '**/LICENSE'
      # .claude/ 是給編輯器和 agent 看的設定，不參與 iOS 編譯。
      - '.claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI 的 Xcode 版本就是「哪些 Swift 語言特性可以用」的判準：
# .claude/skills/write-swift/SKILL.md 開頭的護欄、以及 AGENTS.md 的開發規則，
# 都把這裡的 Xcode / Swift 版本當成硬性前提寫進文件。runner image 的預設
# Xcode 會隨 GitHub 更新漂移，一漂移那兩份文件就無聲地變成錯的——所以這裡
# 釘死，不吃預設值。
#
# 要換版本：改下面的路徑，然後同步更新 SKILL.md 的 toolchain 表格和
# AGENTS.md 那一行。不可以釘回 Xcode 16.x：App Store Connect 從 2026-04-28
# 起只收 Xcode 26（iOS 26 SDK）建置的版本（docs/APP_STORE_PLAN.md 第 1 項）。
# 用 macos-26 而不是 macos-15，是因為 macos-15 的 image 最新只到 Xcode 26.3，
# 之後 App Store 要求的新版 Xcode 也會先出現在 macos-26。
#
# Xcode 26 的 Swift 編得過 write-swift 第 3 節的 approachable concurrency
# （@concurrent、nonisolated(nonsending)），但那是一次獨立的遷移，還沒有做，
# 不要順手做。用 iOS 26 SDK 建置會讓 App 在 iOS 26 以上自動換成 Liquid Glass
# 外觀；兩個版本的 Info.plist（GFlyerIOS/Family/、GFlyerIOS/Public/）的
# UIDesignRequiresCompatibility 暫時保留舊外觀，
# 改用新外觀是另一件事（docs/APP_STORE_PLAN.md 的「風險和還沒確認的事」）。
#
# 這個變數也決定下面 idevice-archive 讀到的 iOS SDK 版本，而 SDK 版本是
# libidevice_ffi.a 快取 key 的一部分：換 Xcode 會讓那份快取自動失效重建，
# 這是刻意的。
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: macos-xcode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 公開版會編譯的檔案（連註解）不可以有親友版的字（docs/APP_STORE_PLAN.md 第 10 項）。
  # 只要 Python，放在 Linux 上，幾秒就有結果，不用等下面 macOS 的 job。
  public-sources:
    name: Public edition source scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check that the scanner catches every rule
        run: python3 scripts/check_public_sources.py --self-test

      - name: Scan the public edition's sources
        run: python3 scripts/check_public_sources.py

      # 下面的 archive job 用它核對建好的公開版 App 的私隱清單（docs/APP_STORE_PLAN.md 第 20 項）
      - name: Check that the privacy manifest checker catches every rule
        run: python3 scripts/check_privacy_manifest.py --self-test

  # 「開放原始碼授權」頁的清單（GFlyerIOS/Resources/OpenSourceLicenses.json）要和 libidevice_ffi.a
  # 實際連結的相符（docs/APP_STORE_PLAN.md 第 18 項）。不建置，只用 cargo tree 和 cargo metadata 讀
  # build_idevice.sh 釘住的 revision 和 features，所以放在 Linux 上，也不碰下面 idevice 的建置快取。
  # 不相符時把產生的清單上傳成 artifact；改 revision 或 features 之後照 scripts/open_source_licenses.py
  # 開頭的說明用 --write 重新產生。
  open-source-licenses:
    name: Open source licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch the pinned idevice source
        run: |
          revision="$(sed -n 's/^IDEVICE_REVISION="\([0-9a-f]*\)"$/\1/p' scripts/build_idevice.sh)"
          test -n "$revision"
          source="$RUNNER_TEMP/idevice"
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/jkcoxson/idevice.git
          git -C "$source" fetch -q --depth 1 origin "$revision"
          git -C "$source" checkout -q --detach FETCH_HEAD
          cargo --version

      - name: Check the licence list against what libidevice_ffi.a links
        run: >-
          python3 -I scripts/open_source_licenses.py
          --source "$RUNNER_TEMP/idevice"
          --out "$RUNNER_TEMP/OpenSourceLicenses.json"

      - name: Upload the generated list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: open-source-licenses
          path: ${{ runner.temp }}/OpenSourceLicenses.json
          if-no-files-found: ignore
          retention-days: 14

  # 親友版（GFlyerIOS）和公開版（GFlyerPublic）各跑一次同一份共用測試，兩個 job 同時跑
  # （docs/APP_STORE_PLAN.md 第 8 項）。截圖只截親友版。
  simulator-tests:
    name: Preview scheme tests (${{ matrix.scheme }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [GFlyerIOS, GFlyerPublic]
    steps:
      # 釘死的版本萬一從 runner image 上消失，要在這裡紅燈，而不是讓後面的
      # xcodebuild 吐一段看不懂的錯。順便把版本印進 log，出問題時不必猜；
      # SKILL.md 表格裡的 Swift 版本就是從這裡讀的。
      - name: Verify the pinned Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "$DEVELOPER_DIR is no longer on this runner image." >&2
            echo "Repin DEVELOPER_DIR in this workflow, then update the toolchain" >&2
            echo "table in .claude/skills/write-swift/SKILL.md and the rule in AGENTS.md." >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$({
            xcrun simctl list devices available --json
          } | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          iphones = [
              device
              for runtime_devices in devices.values()
              for device in runtime_devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("No available iPhone simulator was found")
          print(iphones[0]["udid"])
          ' )"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project GFlyerIOS.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/GFlyerIOS-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      # 這個專案在 Windows 上開發，本機沒有模擬器，所以版面改動以前只能等到
      # 實機才看得到。這一步拿上一步已經建好的 .app 截兩張圖當 artifact，
      # 每次 push 就能直接在 CI 頁面看版面。刻意輸出 PNG 而不是 .xcresult：
      # .xcresult 要 Xcode 才打得開，在 Windows 上等於沒有。
      #
      # 這不取代實機驗證，docs/RELEASE_PROCESS.md 那條規則仍然有效；它只是
      # 讓明顯的版面問題在走到實機之前就被攔下來。
      #
      # 沒有另開 UI test target：simctl 從外面截圖就夠了，代價是只看得到啟動
      # 畫面。要截「工具列收起」那種需要互動的狀態才需要 XCUITest。
      - name: Capture simulator screenshots
        if: matrix.scheme == 'GFlyerIOS'
        run: |
          app="$RUNNER_TEMP/GFlyerIOS-DerivedData/Build/Products/Debug-iphonesimulator/GFlyer.app"
          test -d "$app"
          sim="${{ steps.simulator.outputs.id }}"
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          xcrun simctl bootstatus "$sim" -b
          xcrun simctl install "$sim" "$app"
          for appearance in light dark; do
            xcrun simctl ui "$sim" appearance "$appearance"
            xcrun simctl terminate "$sim" com.geopilot.gflyer.ios || true
            # -GFlyerScreenshotMode 讓 App 跳過更新檢查與留言板刷新。少了它，
            # 截圖會隨著線上有沒有新版本、留言板有沒有未讀而變，看起來像版面動了。
            xcrun simctl launch "$sim" com.geopilot.gflyer.ios -GFlyerScreenshotMode
            # 沒有可以等的訊號，所以先等畫面出現，再給地圖圖磚固定時間載入。
            # iOS 26 的模擬器剛開機時，第一次啟動要 20–45 秒才畫出東西
            # （2026-10-19 實測；iOS 18.5 時 8 秒內就畫好），之前截到的是空白的
            # 啟動畫面，CI 照樣綠燈。用檔案大小判斷：空白畫面約 70 KB，地圖畫好
            # 約 2 MB。
            shot="$shots/main-$appearance.png"
            start=$SECONDS
            until xcrun simctl io "$sim" screenshot "$shot" && [ "$(stat -f%z "$shot")" -gt 400000 ]; do
              if [ $((SECONDS - start)) -ge 120 ]; then
                echo "::warning::main-$appearance.png still looks blank or unfinished after 120 seconds."
                break
              fi
              sleep 5
            done
            echo "main-$appearance: first frame after $((SECONDS - start)) seconds"
            sleep 8
            xcrun simctl io "$sim" screenshot "$shot"
          done
          ls -l "$shots"

      - name: Upload simulator screenshots
        if: matrix.scheme == 'GFlyerIOS'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  idevice-archive:
    name: Idevice unsigned archive
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # 釘死的版本萬一從 runner image 上消失，要在這裡紅燈，而不是讓後面的
      # xcodebuild 吐一段看不懂的錯。順便把版本印進 log，出問題時不必猜。
      - name: Verify the pinned Xcode
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "$DEVELOPER_DIR is no longer on this runner image." >&2
            echo "Repin DEVELOPER_DIR in this workflow, then update the toolchain" >&2
            echo "table in .claude/skills/write-swift/SKILL.md and the rule in AGENTS.md." >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      # build_idevice.sh 用 --sysroot=$(xcrun --sdk iphoneos --show-sdk-path) 產生
      # bindgen 綁定，所以編出來的 .a 綁在某個 iOS SDK 版本上。把 SDK 版本放進
      # 快取 key，runner image 換 Xcode 時就會自動重建，不會拿到對不上的舊檔。
      - name: Read the iOS SDK version for the cache key
        id: toolchain
        run: echo "sdk=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"

      # idevice 的 commit 在 scripts/build_idevice.sh 裡是釘死的，所以只要腳本
      # 和 SDK 都沒變，libidevice_ffi.a 就是同一份，可以直接重用——這一步原本
      # 每次固定燒 96 秒的 Rust 編譯。
      #
      # 要強制重建：改 build_idevice.sh（例如換 IDEVICE_REVISION），或在下面的
      # key 前面加一個版本號（例如 idevice-v2-）。
      - name: Restore the prebuilt idevice library
        id: idevice-cache
        uses: actions/cache/restore@v4
        with:
          path: GFlyerIOS/Vendor/idevice
          key: idevice-ios${{ steps.toolchain.outputs.sdk }}-${{ hashFiles('scripts/build_idevice.sh') }}

      - name: Install Rust
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-idevice-${{ hashFiles('scripts/build_idevice.sh') }}

      - name: Build pinned idevice library
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_idevice.sh
          ./scripts/build_idevice.sh

      # 兩條路徑都要驗：快取命中時檢查還原出來的內容，重新建置時擋住不完整的
      # 產物進快取。少了任何一個檔案，archive 會以難懂的連結錯誤失敗。
      # 這一步一定要在存檔之前，否則壞的產物會被快取起來，之後每次都中毒。
      - name: Verify the idevice library is complete
        run: |
          for required in \
            GFlyerIOS/Vendor/idevice/lib/libidevice_ffi.a \
            GFlyerIOS/Vendor/idevice/include/idevice.h \
            GFlyerIOS/Vendor/idevice/include/module.modulemap
          do
            if [ ! -f "$required" ]; then
              echo "Missing $required. The idevice build or cache is incomplete;" >&2
              echo "bump the cache key in this workflow to force a rebuild." >&2
              exit 1
            fi
          done
          # 在手機上配對（docs/APP_STORE_PLAN.md 第 3、4 項）要用上游 ffi/src/pairing_host.rs
          # 的三個函式：Swift 自己用 NetService 廣播、自己 accept 連線，再把 socket 交給
          # pairable_host_accept_fd。它們由 build_idevice.sh 的 tunnel_tcp_stack 帶進來的
          # remote_pairing feature 編入，換 revision 或改 features 時可能無聲地消失，所以在這裏擋。
          # 不要改用 pairable_host_accept：它用 Rust 自己送 multicast，iOS 上要另外申請權限。
          # idevice.h 是 cbindgen 掃原始碼產生的，不看 features，所以一定要看 .a 裏有沒有。
          # 不要用 nm 逐個 .o 列符號：Rust 的 LLVM 比 Xcode 的新，.o 裏附帶的 bitcode 會讓
          # Xcode 的 nm 報錯，一個 Rust 函式都列不出來（2026-10-20：Xcode 26.6 是 LLVM 21，
          # Rust 1.99 是 LLVM 23）。這裏看 archive 的符號索引 __.SYMDEF，連結器也是靠它找函式。
          # tunnel_create_rppairing 是 App 現在就連結的函式，用來確認索引讀得出來。
          lib=GFlyerIOS/Vendor/idevice/lib/libidevice_ffi.a
          armap="$RUNNER_TEMP/idevice-armap.txt"
          nm --print-armap "$lib" > "$armap" 2>/dev/null || true
          missing=0
          for symbol in tunnel_create_rppairing pairable_host_prepare pairable_host_accept_fd pairable_host_free; do
            if ! grep -q "$symbol(" GFlyerIOS/Vendor/idevice/include/idevice.h; then
              echo "idevice.h does not declare $symbol." >&2
              missing=1
            fi
            if ! grep -q "^_${symbol} in " "$armap"; then
              echo "The symbol index of libidevice_ffi.a does not list $symbol." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The index lists $(grep -c ' in ' "$armap") symbols." >&2
            exit 1
          fi
          echo "Pairing host functions are present."

      # 存檔緊接在驗證之後，不等整個 job 結束。這樣就算後面的 Swift 編譯失敗，
      # 這份 .a 仍然留給下一次用——修編譯錯誤那種來回 push 最需要這一點。
      - name: Save the idevice library for the next run
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: GFlyerIOS/Vendor/idevice
          key: ${{ steps.idevice-cache.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create unsigned device archive
        run: |
          xcodebuild archive \
            -project GFlyerIOS.xcodeproj \
            -scheme GFlyerIOS-Idevice \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GFlyerIOS-Idevice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        run: |
          app_path="$RUNNER_TEMP/GFlyerIOS-Idevice.xcarchive/Products/Applications/GFlyer.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app_path" "$RUNNER_TEMP/ipa/Payload/GFlyer.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/GFlyerIOS-Idevice-unsigned.ipa" Payload

      # 檔案清單、Info.plist、Assets.car 的圖名和執行檔裏的中文字串，存成文字檔放進
      # artifact。改建置設定時（例如 docs/APP_STORE_PLAN.md 第 8 項把 project.yml 分成兩個
      # 版本），拿改之前和之後的兩份 diff，就知道 IPA 的內容有沒有變。
      - name: Summarize the IPA
        run: |
          python3 scripts/ipa_summary.py "$RUNNER_TEMP/GFlyerIOS-Idevice-unsigned.ipa" \
            > "$RUNNER_TEMP/GFlyerIOS-Idevice-summary.txt"
          grep -c . "$RUNNER_TEMP/GFlyerIOS-Idevice-summary.txt"

      - name: Upload unsigned IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: GFlyerIOS-Idevice-unsigned
          path: |
            ${{ runner.temp }}/GFlyerIOS-Idevice-unsigned.ipa
            ${{ runner.temp }}/GFlyerIOS-Idevice-summary.txt
            ${{ runner.temp }}/GFlyerIOS-Idevice.xcarchive
          if-no-files-found: error
          retention-days: 14

      # 公開版只檢查建得出來、內容對，不發佈，所以 artifact 只放摘要，不放 IPA。
      # 放在親友版上傳之後：公開版失敗時，親友版的 IPA 照樣拿得到。
      - name: Create unsigned public archive
        run: |
          xcodebuild archive \
            -project GFlyerIOS.xcodeproj \
            -scheme GFlyerPublic-Idevice \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GFlyerPublic-Idevice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Check and summarize the public app
        run: |
          app_path="$RUNNER_TEMP/GFlyerPublic-Idevice.xcarchive/Products/Applications/GFlyerPublic.app"
          test -d "$app_path"
          test -f "$app_path/Assets.car"
          test -f "$app_path/AppIcon60x60@2x.png"
          plist="$app_path/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.jetpiggy.gflyer
          # App 內建的本機通道（docs/APP_STORE_PLAN.md 第 12 項）
          tunnel_plist="$app_path/PlugIns/GFlyerPublicTunnel.appex/Info.plist"
          test -f "$app_path/PlugIns/GFlyerPublicTunnel.appex/GFlyerPublicTunnel"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$tunnel_plist")" = com.jetpiggy.gflyer.tunnel
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$tunnel_plist")" = com.apple.networkextension.packet-tunnel
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$tunnel_plist")" = \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          # 親友版的私人網址只放在親友版的 Info.plist（docs/APP_STORE_PLAN.md 第二階段的做法）
          for key in GFlyerMessageBoardAPIURL GFlyerCoordinateLibraryURL GFlyerUpdateSourceURL; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              echo "The public app's Info.plist has $key." >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/public-ipa/Payload"
          ditto "$app_path" "$RUNNER_TEMP/public-ipa/Payload/GFlyerPublic.app"
          (cd "$RUNNER_TEMP/public-ipa" && zip -qry "$RUNNER_TEMP/GFlyerPublic-Idevice-unsigned.ipa" Payload)
          python3 scripts/ipa_summary.py "$RUNNER_TEMP/GFlyerPublic-Idevice-unsigned.ipa" \
            > "$RUNNER_TEMP/GFlyerPublic-Idevice-summary.txt"
          grep -c . "$RUNNER_TEMP/GFlyerPublic-Idevice-summary.txt"

      - name: Upload the public app summary
        uses: actions/upload-artifact@v4
        with:
          name: GFlyerPublic-Idevice-summary
          path: ${{ runner.temp }}/GFlyerPublic-Idevice-summary.txt
          if-no-files-found: error
          retention-days: 14

      # 原始碼掃描之外再掃一次建好的 App，管建置時才加進來的字：建置設定、資源、連結進來的
      # 程式庫（docs/APP_STORE_PLAN.md 第 10 項）。放在上傳摘要之後，失敗時摘要照樣拿得到。
      - name: Scan the public app
        run: |
          python3 scripts/check_public_sources.py \
            --app "$RUNNER_TEMP/GFlyerPublic-Idevice.xcarchive/Products/Applications/GFlyerPublic.app"

      # App Store Connect 收到上傳時會掃執行檔用到的「指定原因 API」，私隱清單沒有寫就退回
      # （docs/APP_STORE_PLAN.md 第 20 項）。這裏先照同一份清單掃 App 和通道 extension。
      - name: Check the public app's privacy manifest
        run: |
          app_path="$RUNNER_TEMP/GFlyerPublic-Idevice.xcarchive/Products/Applications/GFlyerPublic.app"
          plutil -lint "$app_path/PrivacyInfo.xcprivacy"
          python3 scripts/check_privacy_manifest.py --app "$app_path"
